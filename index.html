<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PingQuest → Controle 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
  #video, #gl { position: fixed; inset: 0; width: 100%; height: 100%; }
  #video { object-fit: cover; }
  #status {
    position: fixed; left: 50%; top: max(16px, env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    background: rgba(0,0,0,.6); color: #fff; padding: 10px 16px; border-radius: 12px;
    font-size: 15px; white-space: nowrap; z-index: 4;
  }
  #start {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #111; z-index: 5; color: #ddd; text-align: center; padding: 20px; box-sizing: border-box;
  }
  #start p { margin: 0 0 20px; line-height: 1.4; }
  #go { font-size: 18px; padding: 14px 28px; border: 0; border-radius: 12px; background: #4f8cff; color: #fff; }
  #go:disabled { opacity: .5; }
  #recenter {
    position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    z-index: 4; border: 0; border-radius: 999px; padding: 12px 22px; font-size: 16px;
    background: rgba(47,123,255,.9); color: #fff; touch-action: manipulation;
  }
  #dist { position: fixed; right: 12px; top: max(16px, env(safe-area-inset-top, 0px)); z-index: 4; color: #fff; background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 10px; font-size: 13px; }
  #grabUI { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    z-index: 6; display: none; align-items: center; gap: 12px; background: rgba(0,0,0,.7); padding: 10px 14px; border-radius: 999px; color: #fff; font-size: 14px; }
  #grabUI input { width: 38vw; max-width: 220px; }
  #drop { border: 0; border-radius: 999px; padding: 10px 18px; font-size: 15px; background: #14a37f; color: #fff; touch-action: manipulation; }
  #exitTrain { position: fixed; left: 12px; top: max(16px, env(safe-area-inset-top, 0px)); z-index: 5; display: none;
    border: 0; border-radius: 999px; padding: 9px 16px; font-size: 14px; background: rgba(0,0,0,.65); color: #fff; touch-action: manipulation; }
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="gl"></canvas>
<div id="status">Aguardando...</div>
<div id="grabUI"><span>Perto</span><input id="gdist" type="range" min="0.6" max="5" step="0.05" value="1.7"><span>Longe</span><button id="drop">Soltar aqui</button></div>
<button id="exitTrain">‹ Voltar ao menu</button>
<div id="dist">Painel: 1.7 m</div>
<button id="recenter">Trazer painel pra frente</button>

<div id="start">
  <div>
    <p>Vou usar a câmera traseira para procurar o item na sua mão (pomada, controle...).<br>Mostre ele para a câmera e ele vira a raquete.</p>
    <button id="go">Iniciar câmera</button>
  </div>
</div>

const skinMat = new THREE.MeshPhongMaterial({ color: 0xe2ae8c, shininess: 25 });

function capsuleBetween(a, b, r) {
  const len = a.distanceTo(b);
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 16), skinMat);
  const capA = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), skinMat);
  const capB = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), skinMat);
  capA.position.y = len / 2;
  capB.position.y = -len / 2;
  g.add(body, capA, capB);
  g.position.copy(a).add(b).multiplyScalar(0.5);
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  return g;
}

// dedo: sequência de pontos ligados por cápsulas (com juntas arredondadas)
function tube(points, r) {
  const g = new THREE.Group();
  for (let i = 0; i < points.length - 1; i++) g.add(capsuleBetween(points[i], points[i + 1], r));
  for (const p of points) {
    const j = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), skinMat);
    j.position.copy(p);
    g.add(j);
  }
  return g;
}

// mede o controle (no espaço do pivot, em metros): centro e raio em cada altura do grip
function computeGrip() {
  pivot.updateMatrixWorld(true);
  const invP = new THREE.Matrix4().copy(pivot.matrixWorld).invert();
  const pts = [];
  model3d.traverse(o => {
    if (o.isMesh && o.geometry && o.geometry.attributes.position) {
      const pos = o.geometry.attributes.position;
      const m = new THREE.Matrix4().multiplyMatrices(invP, o.matrixWorld);
      const step = Math.max(1, Math.floor(pos.count / 4000));
      for (let i = 0; i < pos.count; i += step) {
        pts.push(new THREE.Vector3().fromBufferAttribute(pos, i).applyMatrix4(m));
      }
    }
  });
  const bb = new THREE.Box3().setFromPoints(pts);
  const y0 = bb.min.y, H = bb.max.y - bb.min.y;
  const band = (fy) => {
    const yc = y0 + fy * H, half = H * 0.03;
    const sel = pts.filter(p => Math.abs(p.y - yc) < half);
    if (sel.length < 4) return null;
    let cx = 0, cz = 0;
    sel.forEach(p => { cx += p.x; cz += p.z; });
    cx /= sel.length; cz /= sel.length;
    const d = sel.map(p => Math.hypot(p.x - cx, p.z - cz)).sort((a, b) => a - b);
    return { y: yc, cx, cz, R: d[Math.floor(d.length * 0.7)] };
  };
  return { band };
}

function buildHand(grip) {
  if (handGroup) rig.remove(handGroup);
  const hand = new THREE.Group();
  const rf = 0.0095;                       // raio do dedo
  const arc = (b, rad, a0, a1, steps) => {
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const a = a0 + (a1 - a0) * i / steps;   // 0 = frente do controle (+z)
      pts.push(new THREE.Vector3(b.cx + rad * Math.sin(a), b.y, b.cz + rad * Math.cos(a)));
    }
    return pts;
  };

  // 4 dedos enrolados em volta do grip, fora da superfície (sem atravessar)
  const fingerBands = [0.1, 0.18, 0.26, 0.34].map(f => grip.band(f)).filter(Boolean);
  fingerBands.forEach(b => hand.add(tube(arc(b, b.R + rf * 1.15, -1.45, 1.45, 4), rf)));

  // polegar sobre o lado de cima do grip
  const thumbB = grip.band(0.42) || fingerBands[fingerBands.length - 1];
  if (thumbB) hand.add(tube(arc(thumbB, thumbB.R + rf * 1.2, -2.0, -0.7, 3), rf * 1.1));

  // palma atrás do grip (fica quase toda escondida)
  if (fingerBands.length) {
    const mid = fingerBands[Math.floor(fingerBands.length / 2)];
    const last = fingerBands[fingerBands.length - 1];
    const palm = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), skinMat);
    palm.scale.set(mid.R * 1.1, (last.y - fingerBands[0].y) * 0.8 + 0.02, mid.R * 0.5);
    palm.position.set(mid.cx, mid.y - 0.01, mid.cz - mid.R * 1.6);
    hand.add(palm);
  }
  rig.add(hand);
  handGroup = hand;
}

// cor de pele: pega pixels com tom de pele na região da mão (ao redor do controle)
const skinCanvas = document.createElement('canvas');
const skinCtx = skinCanvas.getContext('2d', { willReadFrequently: true });
function sampleSkin(b) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const x0 = Math.max(0, Math.floor(b[0] - b[2] * 0.4));
  const x1 = Math.min(vw, Math.ceil(b[0] + b[2] * 1.4));
  const y0 = Math.max(0, Math.floor(b[1] + b[3] * 0.4));
  const y1 = Math.min(vh, Math.ceil(b[1] + b[3] * 1.2));
  const w = x1 - x0, h = y1 - y0;
  if (w <= 2 || h <= 2) return null;
  skinCanvas.width = w; skinCanvas.height = h;
  skinCtx.drawImage(video, x0, y0, w, h, 0, 0, w, h);
  const d = skinCtx.getImageData(0, 0, w, h).data;
  let r = 0, g = 0, bl = 0, n = 0;
  for (let i = 0; i < d.length; i += 16) {
    const R = d[i], G = d[i + 1], B = d[i + 2];
    const mx = Math.max(R, G, B), mn = Math.min(R, G, B);
    if (R > 95 && G > 40 && B > 20 && R > G && R > B && (R - G) > 12 && (mx - mn) > 15 && R < 250) {
      r += R; g += G; bl += B; n++;
    }
  }
  return n > 12 ? [r / n, g / n, bl / n] : null;
}
let skinUpdatedAt = 0;
function updateSkin(b) {
  const now = performance.now();
  if (now - skinUpdatedAt < 4000) return;
  skinUpdatedAt = now;
  const c = sampleSkin(b);
  if (!c) return;
  const k = 0.3;   // suaviza para não piscar a cor
  skinRGB = skinRGB.map((v, i) => v * (1 - k) + c[i] * k);
  skinMat.color.setRGB(skinRGB[0] / 255, skinRGB[1] / 255, skinRGB[2] / 255);
}

// ---------- Carrega o GLB ----------
function loadGLB() {
  if (typeof THREE.GLTFLoader === 'undefined') {
    setStatus('Loader 3D não carregou. Verifique a internet e recarregue.');
    return;
  }
  const bin = atob(GLB_B64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  new THREE.GLTFLoader().parse(bytes.buffer, '', (gltf) => {
    const obj = gltf.scene;
    const box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    obj.position.sub(center);
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    model3d = new THREE.Group();
    model3d.add(obj);
    // raquete: escala UNIFORME (sem deformar). Comprimento = maior medida; cabo embaixo (-Y), pá em cima
    const k = RACKET_LEN / maxDim;
    model3d.scale.setScalar(k);
    model3d.position.y = -OBJ_SIZE_M * 0.5 + RACKET_LEN * 0.5 - 0.02;   // o cabo fica na mão, a pá aparece acima do item
    model3d.rotation.set(0.12, 0.45, 0);                                  // levemente de lado, pra ver o volume
    rig.add(model3d);
    // sem mão virtual: o próprio controle 3D (maior) tampa a mão real
    glbReady = true;
  }, (err) => {
    setStatus('Erro no modelo 3D: ' + (err.message || err));
  });
}

let trk = null;   // { tw, th, cx, cy, tpl, bw, bh, lost }

function trkGrab() {                      // reaproveita o mesmo quadro se for lido de novo em <10 ms
  const n = performance.now();
  if (_sf && n - _sfT < 10) return _sf;
  tcx.drawImage(video, 0, 0, TW_, TH_);

  return _sf;

async function detectLoop() {
  if (model && video.readyState >= 2) {
    try {
      const snap = trkGrab();                              // quadro do mesmo instante da detecção
      const preds = await model.detect(video, 10, 0.1);
      const now = performance.now();
      const vw = video.videoWidth, vh = video.videoHeight;
      const tracking = confirmed && lastBox && (now - lastSeen < 1000);

      const cands = preds.filter(p => {
        const min = SCORE_MIN[p.class];
        if (!min) return false;
        const [x, y, w, h] = p.bbox;
        const area = (w * h) / (vw * vh);
        const ar = Math.max(w, h) / Math.max(1, Math.min(w, h));
        if (area < 0.004 || area > 0.35 || ar > 7) return false;
        let need = min;
        if (tracking) {
          const lb = lastBox, d = Math.hypot((x + w / 2) - (lb[0] + lb[2] / 2), (y + h / 2) - (lb[1] + lb[3] / 2));
          if (d < Math.max(lb[2], lb[3]) * 1.2) need = min * TRACK_FACTOR;
        }
        return p.score >= need;
      }).sort((a, b) => b.score - a.score);
      const hit = cands[0];

      if (recent.length && now - recent[recent.length - 1].t > CONFIRM_WINDOW) recent = [];
      if (hit) {
        const [x, y, w, h] = hit.bbox, size = Math.max(w, h);
        recent = recent.filter(r => now - r.t < CONFIRM_WINDOW);
        recent.push({ t: now, cx: x + w / 2, cy: y + h / 2, size });
        const near = recent.filter(r => Math.hypot(r.cx - (x + w / 2), r.cy - (y + h / 2)) < size * 0.8).length;

        let nearLast = false;
        if (tracking) { const lb = lastBox; nearLast = Math.hypot((x + w / 2) - (lb[0] + lb[2] / 2), (y + h / 2) - (lb[1] + lb[3] / 2)) < Math.max(lb[2], lb[3]) * 1.2; }
        let ok = confirmed && tracking && nearLast;
        if (!ok) {
          const strong = hit.score >= SURE_SCORE;
          if (strong || near >= CONFIRM_HITS) {                // forte = aparece na hora
            ok = (hit.class === 'remote' && strong) || hit.score >= 0.5 || !!sampleSkin(hit.bbox);
          }
        }
        if (ok) {
          confirmed = true;
          lastVerified = now;
          trkSeed(hit.bbox, snap);                             // o rastreador assume e acompanha rápido
          lastSeen = now;
          updateSkin(hit.bbox);
          setStatus(`Raquete! (${hit.class} ${Math.round(hit.score * 100)}%)`);
        } else {
          setStatus(`Verificando... (${near}/${CONFIRM_HITS})`);
        }

        if (confirmed && !trk && now - lastSeen > HOLD_MS) { confirmed = false; recent = []; }
        if (!trk) {

}

const TABLE_LEN = 2.74;     // tamanho OFICIAL de uma mesa de tênis de mesa: 2,74 m de comprimento (1,525 m de largura, tampo a 76 cm do chão)

// autovetores de uma matriz 3x3 simétrica (Jacobi) -> usado para descobrir os eixos reais da mesa
function eig3(m) {
  const a = [m[0].slice(), m[1].slice(), m[2].slice()], v = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
  for (let it = 0; it < 40; it++) {
    let p = 0, q = 1, mx = Math.abs(a[0][1]);
    if (Math.abs(a[0][2]) > mx) { p = 0; q = 2; mx = Math.abs(a[0][2]); }
    if (Math.abs(a[1][2]) > mx) { p = 1; q = 2; mx = Math.abs(a[1][2]); }
    if (mx < 1e-14) break;
    const th = (a[q][q] - a[p][p]) / (2 * a[p][q]);
    const t = (th >= 0 ? 1 : -1) / (Math.abs(th) + Math.sqrt(th * th + 1));
    const c = 1 / Math.sqrt(t * t + 1), sn = t * c;
    for (let k = 0; k < 3; k++) { const x = a[k][p], y = a[k][q]; a[k][p] = c * x - sn * y; a[k][q] = sn * x + c * y; }
    for (let k = 0; k < 3; k++) { const x = a[p][k], y = a[q][k]; a[p][k] = c * x - sn * y; a[q][k] = sn * x + c * y; }
    for (let k = 0; k < 3; k++) { const x = v[k][p], y = v[k][q]; v[k][p] = c * x - sn * y; v[k][q] = sn * x + c * y; }
  }
  return [0, 1, 2].map(i => ({ val: a[i][i], vec: new THREE.Vector3(v[0][i], v[1][i], v[2][i]) })).sort((x, y) => y.val - x.val);
}

function setTableModel(obj) {
  // 1) acha os eixos reais do tampo: comprimento -> X, "cima" da mesa -> Y (fica RETA, sem inclinação)
  // 2) escala para o tamanho REAL (2,74 m de comprimento)
  // 3) centraliza e apoia os pés no chão (y = 0)
  obj.updateMatrixWorld(true);
  let top = null;
  obj.traverse(o => { if (o.isMesh && o.material && /Green_metallic/i.test(o.material.name || '')) top = o; });
  const meshes = [];
  if (top) meshes.push(top); else obj.traverse(o => { if (o.isMesh && o.geometry && o.geometry.attributes.position) meshes.push(o); });
  const pts = [], tv = new THREE.Vector3();
  meshes.forEach(m => {
    const pos = m.geometry.attributes.position, step = Math.max(1, Math.floor(pos.count / 8000));
    for (let i = 0; i < pos.count; i += step) { tv.fromBufferAttribute(pos, i).applyMatrix4(m.matrixWorld); pts.push([tv.x, tv.y, tv.z]); }
  });
  const inner = new THREE.Group();
  inner.add(obj);
  let aligned = false;
  if (pts.length > 20) {
    const mean = [0, 0, 0]; pts.forEach(p => { mean[0] += p[0]; mean[1] += p[1]; mean[2] += p[2]; });
    for (let k = 0; k < 3; k++) mean[k] /= pts.length;
    const cov = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
    pts.forEach(p => { const d = [p[0] - mean[0], p[1] - mean[1], p[2] - mean[2]]; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) cov[i][j] += d[i] * d[j]; });
    const E = eig3(cov);
    // ordena os eixos pela EXTENSÃO real (maior = comprimento da mesa), não pela variância dos vértices
    E.forEach(e => { e.vec.normalize(); let lo = 1e30, hi = -1e30; pts.forEach(q => { const d = q[0] * e.vec.x + q[1] * e.vec.y + q[2] * e.vec.z; if (d < lo) lo = d; if (d > hi) hi = d; }); e.ext = hi - lo; });
    E.sort((a, b) => b.ext - a.ext);
    const e1 = E[0].vec.clone(), e2 = E[1].vec.clone();
    let e3 = new THREE.Vector3().crossVectors(e1, e2).normalize();     // perpendicular ao tampo
    if (e3.y < 0) { e3.negate(); e2.negate(); }                         // o lado de cima da mesa aponta pra cima
    const tilt = Math.acos(Math.min(1, Math.abs(e3.y))) * 180 / Math.PI;
    if (top || tilt > 8) {                                              // modelo inclinado: desinclina por completo
      const B = new THREE.Matrix4().makeBasis(e1, e3, e2.clone().negate());   // colunas: comprimento, cima, largura
      inner.quaternion.setFromRotationMatrix(B.transpose());
    } else {                                                            // modelo já em pé: só gira no eixo vertical
      inner.rotation.y = Math.atan2(e1.z, e1.x);
    }
    aligned = true;
  }
  if (!aligned) inner.rotation.y = 0.677;                               // plano B (valor medido no arquivo)
  inner.updateMatrixWorld(true);
  // garante que o COMPRIMENTO (maior medida horizontal) fique no eixo X: se estiver em Z, gira 90°
  let bx = new THREE.Box3().setFromObject(inner), sz = bx.getSize(new THREE.Vector3());
  if (sz.z > sz.x) { inner.rotateY(Math.PI / 2); inner.updateMatrixWorld(true); bx = new THREE.Box3().setFromObject(inner); sz = bx.getSize(new THREE.Vector3()); }
  // tamanho real: comprimento = 2,74 m
  if (sz.x > 1e-6) inner.scale.setScalar(TABLE_LEN / sz.x);
  inner.updateMatrixWorld(true);
  const full = new THREE.Box3().setFromObject(inner);
  const ref = full;
  const c = ref.getCenter(new THREE.Vector3());
  inner.position.set(-c.x, -full.min.y, -c.z);                           // pés no chão, centro da mesa no ponto
  tableRoot.add(inner);
  console.log('mesa: comprimento', (ref.max.x - ref.min.x).toFixed(2), 'm, altura total', (full.max.y - full.min.y).toFixed(2), 'm');
}

// Aponte o celular para o chão: aparece um anel + a "mesa fantasma" no chão. Segurando firme ~1 s, a mesa fica fixa ali, apoiada no chão.
// (a altura do celular em relação ao chão vem da opção "Em pé"/"Sentado" do menu)
const MESA_W = 1.525;

function applyTablePose(p) {

function startFloorSearch() {            // agora coloca NA HORA, no chão, de frente (sem esperar)

  const cd = h.ok ? Math.min(5.5, Math.max(TABLE_LEN / 2 + 0.5, h.d)) : Math.max(TABLE_LEN / 2 + 0.5, TABLE_DIST[opts.mesa] || TABLE_DIST.normal);

function confirmFloor(force) {
  if (!lastFloor) return;
  floorState = 'off';
  floorMark.visible = false; reticle.visible = false;
  tablePose = lastFloor;
  applyTablePose(tablePose);

  setStatus('Mesa no chão! Ande para os lados e para frente/trás');
}
let tablePose = null;
// calcula onde o olhar encontra o chão; sem o chão à vista, devolve null
function floorHit() {
  cam.getWorldDirection(_fd);
  const hgt = CAM_H[opts.altura] || CAM_H.pe;
  const fy = cam.position.y - hgt;
  const hl = Math.hypot(_fd.x, _fd.z);
  if (_fd.y > -0.17 || hl < 0.05) return { ok: false, fy, dx: hl < 0.05 ? 0 : _fd.x / hl, dz: hl < 0.05 ? -1 : _fd.z / hl };
  const t = -hgt / _fd.y;                          // distância até o chão ao longo do olhar
  const hx = cam.position.x + _fd.x * t, hz = cam.position.z + _fd.z * t;
  const d = Math.hypot(hx - cam.position.x, hz - cam.position.z);
  return { ok: d >= 0.6 && d <= 5.5, d, hx, hz, fy, dx: _fd.x / hl, dz: _fd.z / hl };
}
function floorTick(now) {
  if (floorState !== 'search') return;
  const h = floorHit();
  const hgt = CAM_H[opts.altura] || CAM_H.pe;
  if (h.ok) {
    const cd = Math.min(5.5, Math.max(TABLE_LEN / 2 + 0.5, h.d));         // centro da mesa (a ponta mais perto fica a ~0,5 m de você)
    const pose = { x: cam.position.x + h.dx * cd, z: cam.position.z + h.dz * cd, y: h.fy, yaw: Math.atan2(-h.dx, -h.dz) };
    if (lastFloor && Math.hypot(pose.x - lastFloor.x, pose.z - lastFloor.z) < 0.15 && Math.abs(pose.y - lastFloor.y) < 0.05) floorStable += 1 / 60; else floorStable = 0;
    lastFloor = pose;
    ghost.position.set(pose.x, pose.y + 0.01, pose.z); ghost.rotation.y = pose.yaw + Math.PI / 2;
    reticle.position.set(h.hx, h.fy + 0.012, h.hz);
    floorMark.visible = true; reticle.visible = true;
    ghost.material.color.setHex(0x44e08a); reticle.material.color.setHex(0x44e08a);
    setStatus('Chão encontrado! Segure firme... ' + Math.min(100, Math.round(floorStable / 1.0 * 100)) + '%');
    if (floorStable >= 1.0) confirmFloor();
  } else {
    floorStable = 0; floorMark.visible = false; reticle.visible = false;
    ghost.material.color.setHex(0x3fa9ff);
    if (now - floorStartT > 9000) {                                          // não achou o chão: usa a distância escolhida no menu
      const dist = TABLE_DIST[opts.mesa] || TABLE_DIST.normal;
      lastFloor = { x: cam.position.x + h.dx * dist, z: cam.position.z + h.dz * dist, y: h.fy, yaw: Math.atan2(-h.dx, -h.dz) };
      confirmFloor();
      setStatus('Não vi o chão: coloquei a mesa na altura estimada do chão');
    } else setStatus('Procurando o chão... incline o celular mais para baixo (olhe pro chão a ~2 m à frente)');
  }
}

    if (n < W * H * 0.25) return null;
    a00 += 1; a11 += 1; a22 += 1;
    const det = a00 * (a11 * a22 - a12 * a12) - a01 * (a01 * a22 - a12 * a02) + a02 * (a01 * a12 - a11 * a02);
    if (Math.abs(det) < 1e-3) return null;
    const dtx = (b0 * (a11 * a22 - a12 * a12) - a01 * (b1 * a22 - a12 * b2) + a02 * (b1 * a12 - a11 * b2)) / det;
    const dty = (a00 * (b1 * a22 - a12 * b2) - b0 * (a01 * a22 - a12 * a02) + a02 * (a01 * b2 - b1 * a02)) / det;
    const ds  = (a00 * (a11 * b2 - b1 * a12) - a01 * (a01 * b2 - b1 * a02) + b0 * (a01 * a12 - a11 * a02)) / det;
    p.tx += Math.max(-4, Math.min(4, dtx));
    p.ty += Math.max(-4, Math.min(4, dty));
    p.s  += Math.max(-0.15, Math.min(0.15, ds));
  }
  return p;
}
function estimateMotion(prev, cur, gx0, gy0, masks) {
  const W1 = FW >> 1, H1 = FH >> 1;
  const p1 = gnSolve(prev.g1, cur.g1, W1, H1, { tx: gx0 / 2, ty: gy0 / 2, s: 0 }, 3, masks.m1);
  if (!p1) return null;
  return gnSolve(prev.g0, cur.g0, FW, FH, { tx: p1.tx * 2, ty: p1.ty * 2, s: p1.s }, 2, masks.m0);
}
function clampToPanel() {
  const anchor = (mode === 'train' && tableRoot) ? tableRoot.position : panelMesh.position;
  const minD = mode === 'train' ? 0 : MIN_DIST;
  _off.copy(cam.position).sub(anchor);
  const dist = _off.length();
  if (dist < minD || dist > MAX_DIST) {
    _off.setLength(Math.min(MAX_DIST, Math.max(minD, dist)));
    cam.position.copy(anchor).add(_off);
  }
}

// ---- acelerômetro: sente o passo pro lado / frente / trás na hora ----
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent);
const accBias = new THREE.Vector3(), accV = new THREE.Vector3(), _a = new THREE.Vector3(), _qs = new THREE.Quaternion();
let lastAccT = 0, calmT = 0;
function onAccel(e) {
  const t = performance.now();
  const dt = lastAccT ? Math.min(0.05, (t - lastAccT) / 1000) : 0;
  lastAccT = t;
  const a = e.acceleration;                    // já sem gravidade
  if (!dt || !a || a.x == null) return;
  _a.set(a.x, a.y, a.z);
  if (IOS) _a.multiplyScalar(-1);              // iOS usa o sinal contrário
  _qs.setFromAxisAngle(_zAxis, screenAngle() * Math.PI / 180);   // aparelho -> eixos da tela
  _a.applyQuaternion(_qs).applyQuaternion(cam.quaternion);       // -> mundo
  accBias.lerp(_a, Math.min(1, dt / 2));       // viés lento (alta-passa)
  _a.sub(accBias);
  _a.y *= 0.25;                                // balanço vertical da mão gera erro
  if (_a.length() < ACC_DEAD) { calmT += dt; _a.set(0, 0, 0); } else calmT = 0;
  accV.addScaledVector(_a, dt);
  accV.multiplyScalar(Math.exp(-ACC_DAMP * dt));
  if (calmT > 0.25) accV.multiplyScalar(Math.exp(-14 * dt));     // parou: zera a velocidade (sem desgarrar)
  if (accV.length() > 1.5) accV.setLength(1.5);
  if (accV.lengthSq() < 1e-6) return;
  cam.position.addScaledVector(accV, dt * ACC_GAIN);
  cam.position.y = Math.max(-1, Math.min(1, cam.position.y));
  clampToPanel();
}

function walkLoop() {
  if (video.readyState >= 2 && video.videoWidth) {
    const cur = frames[fi], prev = frames[fi ^ 1];
    grabFrame(cur);
    const curQ = cam.quaternion;
    if (havePrev && haveQ) {
      _qd.copy(prevQ).invert().multiply(curQ);
      if (_qd.w < 0) { _qd.x = -_qd.x; _qd.y = -_qd.y; }
      const expDx = F_PX * 2 * _qd.y, expDy = F_PX * 2 * _qd.x;
      if (Math.hypot(expDx, expDy) < 6) {
        const m = estimateMotion(prev, cur, expDx, expDy, buildMasks());
        if (m) {
          sSm   += (m.s - sSm) * 0.5;
          latSm += ((m.tx - expDx) - latSm) * 0.4;
          verSm += ((m.ty - expDy) - verSm) * 0.4;
          if (Math.abs(sSm) > S_DEAD) {                          // frente (zoom +) / trás (zoom -)
            cam.getWorldDirection(_fwd);
            cam.position.addScaledVector(_fwd, sSm * Z_ASSUMED);
          }
          if (Math.abs(latSm) > T_DEAD) {                        // esquerda/direita (peso menor: o acelerômetro é o principal)
            _right.setFromMatrixColumn(cam.matrixWorld, 0); _right.y = 0;
            if (_right.lengthSq() > 1e-6) cam.position.addScaledVector(_right.normalize(), -latSm / F_PX * Z_ASSUMED * 0.6);
          }
          if (Math.abs(verSm) > T_DEAD) {
            cam.position.y = Math.max(-1, Math.min(1, cam.position.y + verSm / F_PX * Z_ASSUMED * 0.6));
          }
          clampToPanel();
        }
      }
    }
    prevQ.copy(curQ); haveQ = true; havePrev = true; fi ^= 1;
    const dtxt = (mode === 'train' && tableRoot ? 'Mesa: ' + cam.position.distanceTo(tableRoot.position).toFixed(1) : 'Painel: ' + cam.position.distanceTo(panelMesh.position).toFixed(1)) + ' m · andou ' + cam.position.length().toFixed(2) + ' m';
    if (dtxt !== distEl.textContent) distEl.textContent = dtxt;
  }
  setTimeout(walkLoop, 66);                                      // ~15 vezes por segundo
}
walkLoop();

// ---------- Início ----------
goBtn.onclick = async () => {
  goBtn.disabled = true;
  setStatus('Abrindo câmera traseira...');
  enableOrientation();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30, max: 30 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    setStatus('Não consegui acessar a câmera: ' + e.message);
    goBtn.disabled = false;
    return;
  }
  startBox.style.display = 'none';
  panelMesh.visible = true;
  if (typeof cocoSsd === 'undefined' || typeof tf === 'undefined') {
    setStatus('Bibliotecas do detector não carregaram. Verifique a internet e recarregue.');
    return;
  }
  try {
    setStatus('Preparando TensorFlow...');
    await withTimeout(tf.ready(), 30000);
    setStatus('Baixando modelo (aguarde)...');
    model = await withTimeout(cocoSsd.load({ base: 'mobilenet_v2' }), 90000);
  } catch (e) {
    setStatus('Falha no detector: ' + (e.message || e));
    return;
  }
  setStatus('Mostre o item pra câmera...');
  detectLoop();
};

loadGLB();
</script>
